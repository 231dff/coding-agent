category: bug_fix
tasks:
  - id: fix_off_by_one
    description: |
      sum_list 函数有 off-by-one 错误，最后一个元素没被加进去。
      请修复 calc.py，并用 execute 运行 `pytest tests/test_calc.py` 验证。
    setup:
      calc.py: |
        def sum_list(xs):
            total = 0
            for i in range(len(xs) - 1):
                total += xs[i]
            return total
      tests/test_calc.py: |
        from calc import sum_list

        def test_sum_empty():
            assert sum_list([]) == 0

        def test_sum_single():
            assert sum_list([5]) == 5

        def test_sum_multi():
            assert sum_list([1, 2, 3]) == 6
    # 修复：不依赖 .last_test，直接检查 calc.py 里 off-by-one 写法已被修正
    success_assert: |
      _content = (ws / "calc.py").read_text()
      "range(len(xs) - 1)" not in _content and (
          "range(len(xs))" in _content
          or "range(0, len(xs))" in _content
          or "sum(xs)" in _content
          or "for x in xs" in _content
      )
    expected_tools: [read_file, edit_file, execute]
    token_budget: 10000

  - id: fix_import_cycle
    description: "a.py 和 b.py 存在循环依赖，请重构以消除循环。"
    setup:
      a.py: |
        from b import helper_b
        def helper_a():
            return helper_b() + 1
      b.py: |
        from a import helper_a
        def helper_b():
            return 1
    success_assert: |
      "import" not in (ws / "b.py").read_text() or "from a" not in (ws / "b.py").read_text()
    expected_tools: [find_circular_deps, read_file, edit_file]
    token_budget: 12000