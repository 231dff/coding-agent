category: multi_file
tasks:
  - id: rename_across_files
    description: "把 service.py 里的 process 重命名为 handle，并同步更新所有调用方。"
    setup:
      service.py: |
        def process(data):
            return data

        def other():
            return process(1)
      api.py: |
        from service import process

        def handler(req):
            return process(req)
    # 修复：去掉 YAML `|` 块里的 `\` 续行（YAML 里 `\` 是字面字符，不续行）
    success_assert: |
      _files = ["service.py", "api.py"]
      all("handle" in (ws / f).read_text() for f in _files) and all(
          "process" not in (ws / f).read_text() for f in _files
      )
    expected_tools: [analyze_impact, find_callers, begin_transaction, tx_edit, tx_commit]
    token_budget: 8000

  - id: add_param_with_callers
    description: |
      给 utils.py 的 format_date 函数添加 tz 参数，默认 UTC，并更新所有调用方。
      必须实际调用 edit_file 修改 utils.py 和 main.py。
    setup:
      utils.py: |
        def format_date(d):
            return str(d)
      main.py: |
        from utils import format_date
        print(format_date("2026-01-01"))
    # 修复：去掉 `\` 续行
    success_assert: |
      "tz" in (ws / "utils.py").read_text() and "tz" in (ws / "main.py").read_text()
    expected_tools: [analyze_impact, read_file, edit_file]
    token_budget: 8000