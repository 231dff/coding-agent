name: Benchmark

on:
  workflow_dispatch:
  schedule:
    # 每周一 UTC 02:00
    - cron: "0 2 * * 1"

jobs:
  bench:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run benchmarks
        run: |
          python -m benchmarks.runner --compare || true

      - name: Upload baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-result
          path: benchmarks/