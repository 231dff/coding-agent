name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 单元测试 + 覆盖率
  # ============================================================
  test:
    name: Test (${{ matrix.os }} / Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    env:
      LANGCHAIN_TRACING_V2: "false"
      AGENT_ENABLE_MCP: "false"
      AGENT_THINKING_ROUTER: "true"
      AGENT_THINKING_STRATEGY: "auto"
      AGENT_SMOKE_REAL: ""
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests with coverage
        shell: bash
        run: |
          pytest tests/ -v --tb=short --color=yes \
            --ignore=tests/integration \
            --cov=. \
            --cov-fail-under=25 \
            --cov-report=xml \
            --durations=10

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

  # ============================================================
  # 契约测试（独立 job，失败一眼定位）
  # ============================================================
  contract:
    name: Contract Tests
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run contract tests
        run: |
          pytest tests/contracts/ -v --tb=short --no-cov

  # ============================================================
  # 工程量化评测（仅 main 分支或手动触发）
  # ============================================================
  eval:
    name: Eval
    runs-on: ubuntu-latest
    # 只在 main 分支 push 或手动触发时运行，避免浪费 API Token
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    env:
      # ★ 用 qwen，需要 DashScope Key
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      # ★ 评测模式：精简 token / 关闭非必要中间件
      AGENT_EVAL_MODE: "true"
      # ★ 关闭 LangSmith：避免超时刷屏（你本地已经踩过）
      LANGCHAIN_TRACING_V2: "false"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run evals
        run: |
          python -m evals \
            --model qwen:deepseek-v4.1-flash \
            --baseline evals/baseline.json \
            --max-workers 1 \
            --output docs/eval_report.md \
            --results-json evals/latest_results.json \
            --csv evals/results.csv

      - name: Upload eval artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            docs/eval_report.md
            evals/latest_results.json
            evals/results.csv

  # ============================================================
  # 代码风格
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff check
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

  # ============================================================
  # 依赖审计
  # ============================================================
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit
        run: |
          pip install -e . --no-deps
          pip-audit || true